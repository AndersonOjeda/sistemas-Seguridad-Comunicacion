events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # =========================================================================
    # FASE 2 & 4: MITIGACIÓN OWASP A05:2021 (SECURITY MISCONFIGURATION)
    # =========================================================================
    
    # 1. Ocultamiento de Metadatos y Versión (Banner Grabbing Mitigation)
    # Suprime el número de versión de Nginx en cabeceras HTTP y páginas de error por defecto.
    server_tokens off;

    # 2. Cabeceras de Seguridad HTTP (Hardening de Capa 7)
    # Mitigación de Clickjacking (UI Redressing): Bloquea embebido en <iframe> ajenos
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Mitigación de MIME-Sniffing (Content Confusion Attacks): Fuerza apego estricto al Content-Type
    add_header X-Content-Type-Options "nosniff" always;

    # Content Security Policy (CSP): Control estricto de recursos y prevención XSS moderna
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Desactiva el filtro XSS heredado (OWASP recomienda 0 junto con CSP para evitar vulnerabilidades en navegadores legacy)
    add_header X-XSS-Protection "0" always;

    # Restricción de Referrer para evitar fuga de tokens/IDs en URI
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restricción de APIs sensibles del navegador (Principio de Mínimo Privilegio)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # =========================================================================
    # FASE 2 & 4: PROTECCIÓN ANTI-SLOWLORIS Y LÍMITES DE CONEXIÓN / TIMEOUTS
    # =========================================================================

    # Timeouts estrictos para mitigar ataques de conexiones lentas (Slowloris / Slow HTTP)
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    reset_timedout_connection on;
    client_max_body_size  1m;

    # Límite de conexiones TCP simultáneas por IP en memoria compartida (10 MB)
    limit_conn_zone $binary_remote_addr zone=zona_conn:10m;
    limit_conn_status 503;

    # =========================================================================
    # FASE 2 & 4: DEFENSA ACTIVA EN CAPA 7 - RATE LIMITING (LEAKY BUCKET)
    # =========================================================================
    
    # Zona de memoria compartida para rastreo de estados por IP:
    # - $binary_remote_addr: Usa 4 bytes (IPv4) o 16 bytes (IPv6) por cliente, ahorrando RAM frente a texto.
    # - zone=zona_limite:10m: Reserva 10 Megabytes (~160,000 IPs concurrentes en SHM).
    # - rate=5r/s: Tasa nominal de fuga/procesamiento (1 petición cada 200 milisegundos).
    limit_req_zone $binary_remote_addr zone=zona_limite:10m rate=5r/s;

    # Código de estado HTTP para solicitudes que excedan la cuota:
    # 503 Service Unavailable (por defecto en Nginx) o 429 Too Many Requests (RFC 6585)
    limit_req_status 503;

    server {
        listen 80;
        server_name localhost;

        location / {
            # Restricción de métodos HTTP: solo permite GET y HEAD (bloquea POST, PUT, DELETE, TRACE)
            limit_except GET {
                deny all;
            }

            # Máximo 20 conexiones TCP concurrentes por IP (anti-Slowloris / agotamiento de sockets)
            limit_conn zona_conn 20;

            # Aplicación de la zona de mitigación:
            # - burst=10: Capacidad máxima del 'bucket' para absorber ráfagas transitorias (10 slots de tolerancia).
            # - nodelay: Procesa los slots del bucket inmediatamente sin retardo artificial,
            #   pero rechaza de forma no bloqueante (Fail-Fast) toda solicitud adicional por encima del burst.
            limit_req zone=zona_limite burst=10 nodelay;

            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # Página de error personalizada para el rechazo por Rate Limiting
        error_page 503 /custom_503.html;
        location = /custom_503.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
