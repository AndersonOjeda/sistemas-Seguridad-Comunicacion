events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    # Conserva método y ruta originales tras error_page 503, sin query strings.
    map $request_uri $log_path {
        ~^(?<original_path>[^?]*) $original_path;
    }
    map $request $log_method {
        ~^(?<original_method>[A-Z]+) $original_method;
    }
    log_format monitor escape=json '{"time":"$time_iso8601","method":"$log_method","path":"$log_path","status":$status,"ip":"$remote_addr","seconds":$request_time,"rate_limit":"$limit_req_status","connection_limit":"$limit_conn_status"}';
    access_log /monitor/access.log monitor;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    reset_timedout_connection on;
    client_max_body_size  1m;

    limit_conn_zone $binary_remote_addr zone=zona_conn:10m;
    limit_conn_status 503;
    limit_req_zone $binary_remote_addr zone=zona_limite:10m rate=5r/s;
    limit_req_status 503;

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;

        # Ruta de comparación: la aplicación recibe todas las peticiones.
        location = /api/demo/open {
            limit_except GET { deny all; }
            proxy_pass http://demo_app:8000;
        }

        # Ruta defendida: Nginx rechaza el exceso antes de enviarlo a Python.
        location = /api/demo/protected {
            limit_except GET { deny all; }
            limit_conn zona_conn 20;
            limit_req zone=zona_limite burst=10 nodelay;
            proxy_pass http://demo_app:8000;
        }

        # Contador de laboratorio, de solo lectura; no cuenta como solicitud de prueba.
        location = /api/demo/stats {
            limit_except GET { deny all; }
            proxy_pass http://demo_app:8000;
        }

        location = /api/monitor {
            limit_except GET { deny all; }
            proxy_pass http://demo_app:8000;
        }

        location = /api/products {
            limit_except GET { deny all; }
            limit_conn zona_conn 20;
            limit_req zone=zona_limite burst=10 nodelay;
            proxy_pass http://demo_app:8000;
        }

        # Sólo estas dos rutas de autenticación admiten POST.
        location ~ ^/api/auth/(login|logout)$ {
            limit_except POST { deny all; }
            limit_conn zona_conn 20;
            limit_req zone=zona_limite burst=10 nodelay;
            proxy_pass http://demo_app:8000;
        }

        location = /api/session {
            limit_except GET { deny all; }
            limit_conn zona_conn 20;
            limit_req zone=zona_limite burst=10 nodelay;
            proxy_pass http://demo_app:8000;
        }

        location = /api/admin/load {
            limit_except GET POST { deny all; }
            limit_conn zona_conn 20;
            limit_req zone=zona_limite burst=10 nodelay;
            proxy_pass http://demo_app:8000;
        }

        # También protege las URLs .html originales: no existe un acceso estático alterno.
        location ~ ^/(admin/?|panel/?|monitor\.html|tienda\.html)$ {
            limit_except GET { deny all; }
            limit_conn zona_conn 20;
            limit_req zone=zona_limite burst=10 nodelay;
            proxy_pass http://demo_app:8000;
        }

        location /api/ {
            limit_except GET { deny all; }
            # try_files mantiene la evaluación de limit_except antes del 404.
            root /usr/share/nginx/html;
            try_files /__api_not_found__ =404;
        }

        location / {
            limit_except GET { deny all; }
            limit_conn zona_conn 20;
            limit_req zone=zona_limite burst=10 nodelay;
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        error_page 503 /custom_503.html;
        location = /custom_503.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
