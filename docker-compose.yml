services:
  servidor-defensa:
    image: nginx:alpine
    container_name: servidor-defensa
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    networks:
      red-defensa:
        ipv4_address: 172.28.0.10

  cliente-atacante:
    image: alpine:latest
    container_name: cliente-atacante
    command: tail -f /dev/null
    networks:
      red-defensa:
        ipv4_address: 172.28.0.20
    depends_on:
      - servidor-defensa

networks:
  red-defensa:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
